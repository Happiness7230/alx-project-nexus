databases:
  - name: poll-system-db
    databaseName: poll_system
    user: poll_system_user
    plan: free

services:
  - type: web
    name: poll-system-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: poll-system-db
          property: connectionString
      - key: ALLOWED_HOSTS
        sync: false

    
