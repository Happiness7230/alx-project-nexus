openapi: 3.0.0
info:
  title: Online Polling System API
  description: >
    The Online Polling API allows users to create polls, vote, and view results.
    Authentication is handled using JWT tokens.
  version: 1.0.0
  contact:
    name: Developer
    email: support@polls.example

servers:
  - url: https://YOUR_RENDER_URL/api
    description: Production Server

tags:
  - name: Authentication
  - name: Polls
  - name: Votes

paths:
  /auth/register/:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                email: { type: string }
                password: { type: string }
              required: [username, email, password]
      responses:
        "201":
          description: User created successfully
        "400":
          description: Bad request – invalid input

  /auth/token/:
    post:
      tags: [Authentication]
      summary: Obtain JWT access and refresh tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Tokens generated
        "401":
          description: Invalid login credentials

  /auth/token/refresh/:
    post:
      tags: [Authentication]
      summary: Refresh JWT access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh: { type: string }
      responses:
        "200":
          description: Token refreshed
        "401":
          description: Invalid or expired refresh token

  /polls/:
    get:
      tags: [Polls]
      summary: List all polls
      responses:
        "200":
          description: Returns all polls
    post:
      tags: [Polls]
      summary: Create a new poll
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string }
                choices:
                  type: array
                  items: { type: string }
              required: [question, choices]
      responses:
        "201":
          description: Poll created successfully
        "401":
          description: Authentication required

  /polls/{poll_id}/:
    get:
      tags: [Polls]
      summary: Get a single poll
      parameters:
        - name: poll_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Poll retrieved }
        "404": { description: Poll not found }
    put:
      tags: [Polls]
      summary: Update a poll
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: poll_id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                question: { type: string }
                choices:
                  type: array
                  items: { type: string }
      responses:
        "200": { description: Poll updated }
        "403": { description: Not allowed }
        "404": { description: Poll not found }
    delete:
      tags: [Polls]
      summary: Delete a poll
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: poll_id
          required: true
          schema: { type: integer }
      responses:
        "204": { description: Poll deleted }
        "403": { description: Not allowed }
        "404": { description: Poll not found }

  /polls/{poll_id}/vote/:
    post:
      tags: [Votes]
      summary: Vote on a poll
      security: [{ bearerAuth: [] }]
      parameters:
        - name: poll_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                choice_id: { type: integer }
              required: [choice_id]
      responses:
        "201": { description: Vote submitted }
        "400": { description: Already voted / Bad request }
        "404": { description: Poll or choice not found }

  /polls/{poll_id}/results/:
    get:
      tags: [Votes]
      summary: View poll results
      parameters:
        - in: path
          name: poll_id
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Poll results }
        "404": { description: Poll not found }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
